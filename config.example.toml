# Copy to config.toml (git-ignored) and fill in. Nothing site-specific belongs in the code.

[seestar]
alpaca = "seestar.local:32323"      # SeeStar's Alpaca server (enable Alpaca in the SeeStar app)

[site]
name = "My observatory"
latitude = 60.0                    # deg, north positive
longitude = 25.0                   # deg, east positive
elevation_m = 50

[mount]
# EQ wedge. Positive RA MoveAxis = increasing hour angle. Measure YOUR cable before trusting this:
# home_ha is the RA-axis hour angle when the scope sits at its home/park position, and the limits are
# how far the RA axis may turn from there without straining the cable.
home_ha = -90.0
ccw_limit_deg = 90.0
cw_limit_deg = 270.0
limit_margin_deg = 5.0

[ipcam]
rtsp_url = ""                      # optional, e.g. "rtsp://camera-host:8554/scope" (go2rtc etc.)

[roof]
alpaca = ""                        # optional ASCOM Alpaca Dome (roof/enclosure), "host:port"
dome_number = 0

# Optional HTTP roof control instead of / besides an Alpaca Dome.
open_url = ""                      # POSTed to open
close_url = ""                     # POSTed to close
state_url = ""                     # GET, JSON; "open": bool is used if present

[safety]
url = ""                           # optional HTTP JSON safety endpoint, e.g. returns {"safe": true, "reasons": []}
field = "safe"                     # boolean field; false = unsafe
reasons_field = "reasons"
poll_s = 30
stale_after_s = 300                # no good answer for this long = unsafe

[hooks]
on_parked = ""                     # optional URL POSTed after a verified guarded park
on_unparked = ""                   # optional URL POSTed when leaving park

[paths]
data_dir = "data"
projections_dir = ""               # optional: plate solver for the wide camera (see README)
