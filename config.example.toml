# Copy to config.toml (git-ignored) and fill in. Nothing site-specific belongs in the code.

[seestar]
alpaca = "seestar.local:32323"      # SeeStar's Alpaca server (enable Alpaca in the SeeStar app)

[site]
name = "My observatory"
latitude = 60.0                    # deg, north positive
longitude = 25.0                   # deg, east positive
elevation_m = 50

[mount]
# EQ wedge. Positive RA MoveAxis = increasing hour angle. Measure YOUR cable before trusting this:
# home_ha is the RA-axis hour angle when the scope sits at its home/park position, and the limits are
# how far the RA axis may turn from there without straining the cable.
home_ha = -90.0
ccw_limit_deg = 90.0
cw_limit_deg = 270.0
limit_margin_deg = 5.0

[ipcam]
rtsp_url = ""                      # optional, e.g. "rtsp://camera-host:8554/scope" (go2rtc etc.)

[roof]
alpaca = ""                        # optional ASCOM Alpaca Dome (roof/enclosure), "host:port"
dome_number = 0

# Optional HTTP roof control instead of / besides an Alpaca Dome.
open_url = ""                      # POSTed to open
close_url = ""                     # POSTed to close
state_url = ""                     # GET, JSON; "open": bool is used if present
# An answer {"message": REASON, "error": true} (any HTTP status) to open/close is a refusal; the reason is shown.
timeout_s = 300                    # open/close must report done within this

[safety]
url = ""                           # optional HTTP JSON safety endpoint, e.g. returns {"safe": true, "reasons": []}
field = "safe"                     # boolean field; false = unsafe
reasons_field = "reasons"
poll_s = 30
stale_after_s = 300                # no good answer for this long = unsafe

[hooks]
on_parked = ""                     # optional URL POSTed after a verified guarded park
on_unparked = ""                   # optional URL POSTed when leaving park

[telephoto]
camera = 0                         # Alpaca device numbers on the SeeStar
filterwheel = 0
focuser = 0
pixel_arcsec = 3.74                # 2.9 um at 160 mm
focal_mm = 160
pixel_um = 2.9

[solver]
# Telephoto plate solver: ASTAP command-line solver + D05 star database (see docs/astap.md)
kind = "astap"                     # "astap" or "none"
astap_path = "/opt/astap/astap_cli"  # the ASTAP CLI binary (a bare name is looked up on PATH)
db_dir = "/opt/astap"              # directory holding the d05_*.1476 files ("" = ASTAP's own default)
database = "d05"                   # -D: database to use
radius_deg = 6                     # search radius around the hint (pointing is ~2 deg off before a sync)
downsample = 2                     # -z: 2x2 downsample of the raw Bayer frame before detection
timeout_s = 30

[sequencer]
host = "127.0.0.1"                 # "0.0.0.0" to reach the status page from a phone on the LAN
port = 8640
api_token = ""                     # if set, commands need "Authorization: Bearer <token>" (page: ?token=...)
monitor_s = 2                      # status refresh of mount position / cable angle
frame_overhead_s = 15              # download + save per frame, used in the look-ahead checks
cable_reserve_min = 2              # stop tracking this many minutes before the cable limit
park_guard_deg = 10                # abort the firmware Park if RA turns more than this
dew_heater = true                  # switch the dew heater on before imaging
auto_close_on_unsafe = false       # true: on unsafe, close the roof after a verified park without operator
                                   # confirmation. false: park, then "roof close requested" (operator runs
                                   # `roof close`). A separate roof/safety controller is the better owner
                                   # of unattended closing if the site has one.

[darks]
temp_bin_c = 2.0                   # sensor temperature bin width
temp_tolerance_c = 1.0             # a light may be this far outside a master's bin
max_age_days = 60
expiring_days = 7                  # shown as "expiring" this long before max age
count = 15                         # frames per master
plans = []                         # planned plan files whose missing darks are listed too

[polar]
# Polar alignment (python -m sequencer polar start, or the phone page /polar). See docs/polar-alignment.md.
dec = 65.0                         # Dec of the three points ("current" = where the scope points now)
span_deg = 30.0                    # RA axis moves +- this around the current HA (must fit the cable window)
points = 3
exposure_s = 5.0                   # telephoto exposure per solve
gain = 80
adjust_timeout_min = 20            # the live loop stops after this long
tolerance_arcmin = 2.0             # "OK" below this (green numbers, tolerance circle)
track_during_adjust = true         # keep stars still while you turn the knobs (if the cable window allows)
min_alt = 15.0
pressure_hpa = 1010.0              # refraction of the pole (about 0.5' at 60 deg); mean values are fine
temperature_c = 10.0
alt_knob_sign = 0                  # once learned: +1 if turning the alt knob clockwise raises the axis, -1 if it lowers
az_knob_sign = 0                   # +1 if clockwise moves the axis east, -1 west; 0 = show axis motion only

[paths]
data_dir = "data"
projections_dir = ""               # optional: plate solver for the wide camera (see README)

[sattrack]
# Satellite tracking (docs/sattrack.md). Elements: a URL template with {norad} and optional {source}
# returning CelesTrak-style OMM JSON. A bearer key, if needed, is read from the environment variable
# named here (never put the key in this file).
elements_url = "https://celestrak.org/NORAD/elements/gp.php?CATNR={norad}&FORMAT=json"
elements_source = ""
elements_key_env = ""
user_agent = "seestar-commander-sattrack/0.1"
horizon = ""                       # optional .hrz/.txt/horizon.json; empty = min_alt only
min_alt = 10.0
min_track_s = 60.0                 # shortest trackable stretch worth a "trim" verdict
step_s = 0.1
# Motion limits. Set max_rate from the measured top speed (bench T2) minus a margin.
max_rate_deg_s = 5.0
dec_min = -80.0
dec_max = 85.0
runaway_ra_s = 30.0                # a rate must be safe to hold this long with no further commands
runaway_dec_s = 10.0
dec_low_stop = true                # firmware stops Dec MoveAxis at the arm fold
