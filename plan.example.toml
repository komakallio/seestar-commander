# Example plan for `python -m sequencer run plan.example.toml` (TOML; YAML works too with PyYAML).
# Coordinates are J2000. Steps run in order; each step is one target.

[plan]
name = "Example night"
park_at_end = true                 # guarded park when the plan ends (or the night is over)
# Optional roof handling (needs a [roof] in config.toml). For supervised or simple setups; if the site
# has its own roof/safety controller, let that own unattended closing.
open_roof_at_start = false         # open before the first target, only while safety reports safe;
                                   # refused, unsafe or not open within [roof] timeout_s = plan stops
close_roof_at_end = false          # close after the end-of-plan guarded park, only once it's verified
                                   # and the mount reads AtPark (needs park_at_end = true)

[constraints]
min_alt = 20                       # deg, per step overridable with min_alt
# horizon = "data/pano/out/site.hrz"   # az/alt list from the horizon tool (.hrz, .txt or horizon.json)
sun_max_alt = -12                  # stop the plan when the Sun is higher than this
end_time = "05:30"                 # next occurrence, in `timezone`; or an ISO datetime
timezone = "UTC"                   # e.g. "Europe/Berlin"

[defaults]                         # apply to every step unless the step says otherwise
exposure = 60                      # s
gain = 80
filter = "IR"                      # IR or LP (Dark is for the dark library only)
count = 20
dither_every = 0                   # dither before every Nth light (0 = off); see docs/design.md#dithering
dither_px = 15                     # max offset from the centred position, telephoto px (random in a disc)
dither_settle_s = 5                # wait after the move before the next exposure
dither_recentre_every = 0          # plate-solve re-centre instead of every Nth dither (0 = never)
dither_recentre_px = 0             # ... or when the drift since the last centring exceeds this many px (0 = off)
# wide_every = 0                   # one wide-camera frame per N lights, taken alongside (0 = off); unset: [wide] in config.toml
# wide_exposure = 10               # s (wide camera: up to 60 s); starts only where it ends before the next dither
# wide_gain = 100
centre = "auto"                    # auto = plate solve if a solver is available, else fallback
fallback = "none"                  # none = trust the mount pointing; blob = centre the brightest extended object
solve_exposure = 2                 # s, centring solve frames (ASTAP solves 2 s frames easily)
centre_tol_arcmin = 3
qa = { min_stars = 15, max_hfr = 8.0, max_ecc = 0.7 }   # rejected frames are saved but not stacked

[[step]]
target = "M31"                     # built-in names: M31 M33 M42 M45 M13 M27 M51 M57 M81 M101 M1 M35 M76 NGC7000 ...
count = 30
fallback = "blob"
dither_every = 1                   # unguided 60 s subs: a dither every frame keeps hot pixels out of the stack
dither_recentre_every = 10
wide_every = 5                     # a wide frame with every 5th light (inside its 60 s, before the next dither)

[[step]]
name = "Heart nebula field"
ra = "02h33m22s"
dec = "+61d26m36s"
filter = "LP"
exposure = 120
count = 15
